[project]
name = "openalgo-research-nautilus-runtime"
version = "0.1.0"
description = "Isolated pinned NautilusTrader calculation runtime for OpenAlgo Research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nautilus-trader==1.231.0",
  "numpy==2.4.4",
  "pandas==2.3.3",
  "pyarrow==25.0.1",
]

[dependency-groups]
test = ["pytest==9.1.1", "pytest-timeout==2.4.0"]

[tool.uv]
package = false
