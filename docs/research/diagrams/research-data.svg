<text x="496" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202722" text-anchor="start">OpenAlgo history service</text>
<text x="496" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5b665e" text-anchor="start">Your connected broker</text>
<text x="496" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5b665e" text-anchor="start">Only missing windows</text>
