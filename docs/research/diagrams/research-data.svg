<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="648" viewBox="0 0 1280 648" role="img" aria-labelledby="research-data-title research-data-desc">
<title id="research-data-title">The same broker connection. The same price archive.</title>
<desc id="research-data-desc">CSV signals, execution rules and the full optimizer range determine daily or one-minute requirements. Read matching prices from OpenAlgo Historify. Request missing windows through OpenAlgo history and the connected broker, then save and read back those candles in the same Historify database. Freeze prepared inputs once and reuse them across trials. Exact replay uses the saved inputs. Date-only signals with daily execution stay daily; timed or intraday rules require one-minute data; mixed strategies use the finest needed interval.</desc>
<defs>
<marker id="research-data-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5b665e"/></marker>
<marker id="research-data-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#147d5a"/></marker>
<marker id="research-data-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#365e88"/></marker>
</defs>
<rect width="1280" height="648" fill="#fafaf8"/>
<text x="48" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#147d5a" text-anchor="start" letter-spacing="2">OPENALGO RESEARCH / 03 / WHERE PRICES COME FROM</text>
<text x="48" y="92" font-family="Georgia, serif" font-size="40" font-weight="400" fill="#202722" text-anchor="start">The same broker connection. The same price archive.</text>
<text x="48" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5b665e" text-anchor="start">Research plans the data it needs, reuses available candles and fills missing coverage.</text>
<path data-connector="true" d="M 368 244 H 480" fill="none" stroke="#5b665e" stroke-width="1.6" marker-end="url(#research-data-arrow)"/>
<path data-connector="true" d="M 800 244 H 912" fill="none" stroke="#147d5a" stroke-width="1.6" marker-end="url(#research-data-arrow-accent)"/>
<path data-connector="true" d="M 568 308 V 440" fill="none" stroke="#365e88" stroke-width="1.6" marker-end="url(#research-data-arrow-link)"/>
<path data-connector="true" d="M 712 440 V 308" fill="none" stroke="#365e88" stroke-width="1.6" marker-end="url(#research-data-arrow-link)"/>
<g data-label="true"><rect x="804" y="204" width="104" height="24" fill="#fafaf8"/>
<text x="856.0" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b665e" text-anchor="middle">Ready</text>
</g>
