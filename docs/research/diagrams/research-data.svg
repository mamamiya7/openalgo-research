<rect x="48" y="168" width="320" height="140" rx="8" fill="white" stroke="#a9b4aa" stroke-width="1.2"/>
<text x="64" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#202722" text-anchor="start">Plan requirements</text>
<text x="64" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5b665e" text-anchor="start">Signals + execution rules</text>
