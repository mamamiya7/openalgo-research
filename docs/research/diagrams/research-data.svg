<text x="48" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202722" text-anchor="start">Daily rules → daily bars</text>
<text x="48" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5b665e" text-anchor="start">Timed rules → 1-minute bars</text>
<text x="48" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5b665e" text-anchor="start">A mixed portfolio uses the</text>
<text x="48" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5b665e" text-anchor="start">finest interval it requires.</text>
<text x="912" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#202722" text-anchor="start">Prepare once.</text>
<text x="912" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#202722" text-anchor="start">Run many trials.</text>
<text x="912" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5b665e" text-anchor="start">No download per trial.</text>
<path d="M 48 584 H 1232" stroke="#d7dcd6" fill="none"/>
<text x="48" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5b665e" text-anchor="start">Stops, targets and trailing alone do not force minute data. Broker history availability still determines usable coverage.</text>
</svg>
