<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="648" viewBox="0 0 1280 648" role="img" aria-labelledby="research-optimization-title research-optimization-desc">
<title id="research-optimization-title">Optuna searches. A backtesting engine evaluates.</title>
<desc id="research-optimization-desc">The user selects settings, ranges, objective and trial budget. Optuna proposes a parameter combination through TPE or grid search. VectorBT or optional NautilusTrader backtests it using the frozen input data. Research records the result and returns the objective score to Optuna for subsequent trials. The finished study retains settings and results for review and exact replay. An optional later-period check chooses settings on earlier signals and evaluates them on a separate later period.</desc>
<defs>
<marker id="research-optimization-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5b665e"/></marker>
<marker id="research-optimization-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#147d5a"/></marker>
<marker id="research-optimization-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#365e88"/></marker>
</defs>
