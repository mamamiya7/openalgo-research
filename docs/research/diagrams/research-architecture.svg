<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="672" viewBox="0 0 1280 672" role="img" aria-labelledby="research-architecture-title research-architecture-desc">
<title id="research-architecture-title">One OpenAlgo experience, established research engines</title>
<desc id="research-architecture-desc">OpenAlgo provides the account, broker history service and Historify archive. Our native Research screens, services and background worker manage CSV inputs, trading rules, data planning, jobs and saved results. VectorBT simulates portfolios, Optuna searches settings using the selected simulation engine, and optional NautilusTrader runs event-driven simulations in Linux or WSL. The diagram shows responsibilities; the optimization loop is detailed separately.</desc>
<defs>
<marker id="research-architecture-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5b665e"/></marker>
<marker id="research-architecture-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#147d5a"/></marker>
<marker id="research-architecture-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#365e88"/></marker>
</defs>
